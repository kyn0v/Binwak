name: Binwak runtime maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: check
        options: [check, prepare, activate, verify, rollback]
        required: true
      payload_sha256:
        type: string
        required: true
        description: Independently reviewed runtime payload SHA-256
      bundle_sha256:
        type: string
        required: true
        description: Independently reviewed executable bundle SHA-256
      workflow_sha256:
        type: string
        required: true
        description: Independently reviewed update-secret.yml SHA-256
      reviewed_commit:
        type: string
        required: true
        description: Exact diagnostic commit approved for dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: update-secret
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit }}
          persist-credentials: false
      - name: Bind reviewed workflow revision
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          REVIEWED_WORKFLOW_SHA256: ${{ inputs.workflow_sha256 }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$REVIEWED_WORKFLOW_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 2
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/update-secret.yml@"* ]] || exit 2
          [[ "$GITHUB_SHA" == "$REVIEWED_COMMIT" && "$(git rev-parse HEAD)" == "$REVIEWED_COMMIT" ]] || exit 2
          actual=$(sha256sum .github/workflows/update-secret.yml)
          [[ "${actual%% *}" == "$REVIEWED_WORKFLOW_SHA256" ]] || exit 2
      - name: Assert Server maintenance exclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || exit 2
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/286412249" --jq '.state')" == disabled_manually ]] || exit 2
          for status in queued in_progress requested waiting pending; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/286412249/runs?status=$status&per_page=1" --jq '.total_count')
            [[ "$count" == 0 ]] || exit 2
          done
      - name: Configure deployment SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || exit 2
          (( 10#$PORT >= 1 && 10#$PORT <= 65535 )) || exit 2
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || exit 2
          [[ -n "$SSH_PRIVATE_KEY" ]] || exit 2
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Run reviewed Binwak-only runtime maintenance
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SERVER_PATH: ${{ secrets.DEPLOY_SERVER_PATH }}
          ACTION: ${{ inputs.action }}
          REVIEWED_SHA256: ${{ inputs.payload_sha256 }}
          REVIEWED_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SERVER_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_SERVER_PATH" != / ]] || exit 2
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]] || exit 2
          [[ "$ACTION" =~ ^(check|prepare|activate|verify|rollback)$ ]] || exit 2
          [[ "$REVIEWED_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 2
          [[ "$REVIEWED_BUNDLE_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 2
          bundle=$(mktemp "$RUNNER_TEMP/binwak-reviewed-bundle.XXXXXXXXXX")
          trap 'rm -f -- "$bundle"' EXIT
          cp scripts/upgrade-runtime.sh "$bundle"
          chmod 400 "$bundle"
          actual=$(sha256sum "$bundle")
          [[ "${actual%% *}" == "$REVIEWED_BUNDLE_SHA256" ]] || exit 2
          status=0
          result=$(ssh -o BatchMode=yes -o ConnectTimeout=15 -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '$DEPLOY_SERVER_PATH' && BINWAK_TOPOLOGY_REVIEWED=cc5c713-run42237141183-private-runtime BINWAK_RELEASE_186=failed-before-live-release BINWAK_DEPLOYMENTS_PAUSED=yes BINWAK_INDEPENDENT_REVIEW=approved-v3 BINWAK_REVIEWED_PAYLOAD_SHA256='$REVIEWED_SHA256' bash -s -- '$ACTION'" < "$bundle") || status=$?
          printf '%s\n' "$result"
          (( status == 0 )) || exit "$status"
          case "$ACTION/$result" in
            'check/[runtime-upgrade] preconditions-ok'|'prepare/[runtime-upgrade] prepared'|'prepare/[runtime-upgrade] already-prepared'|'activate/[runtime-upgrade] active'|'activate/[runtime-upgrade] already-active'|'verify/[runtime-upgrade] verified-active'|'rollback/[runtime-upgrade] rolled-back') ;;
            *) printf '%s\n' '[runtime-upgrade] STOP UNEXPECTED_ACTION_RESULT' >&2; exit 2 ;;
          esac
